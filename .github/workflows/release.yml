name: "Release"

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize manual releases so two runs cannot race while checking the package
# version or publishing the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases may only be dispatched from the main branch." >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-validate-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-validate-

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libgtk-3-dev \
            libssl-dev \
            libudev-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libegl-dev \
            libgbm-dev \
            libdrm-dev \
            libxcb1-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libclang-dev \
            clang \
            pkg-config

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo test --all-targets --all-features --locked

      - name: RustSec audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  prepare-release:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read and validate the package version
        id: get-version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -nE '/^\[package\]$/,/^\[/{s/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p;}' Cargo.toml | head -1)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Cargo.toml does not contain a valid package version" >&2
            exit 1
          fi
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; bump Cargo.toml before releasing" >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const version = '${{ steps.get-version.outputs.version }}';
            // Only consider published stable releases so the diff link is stable.
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 20,
            });
            const prevTag = releases.find(r => !r.draft && !r.prerelease)?.tag_name || '';
            let commits = [];
            if (prevTag) {
              try {
                const { data: comparison } = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: prevTag,
                  head: context.sha,
                });
                commits = comparison.commits.map(c => c.commit.message.split('\n')[0]);
              } catch (e) {
                core.warning(`Could not compare against ${prevTag}: ${e.message}`);
              }
            }
            const groups = {
              'Features': [],
              'Bug Fixes': [],
              'Improvements': [],
              'CI / Build': [],
              'Other': [],
            };
            for (const msg of commits) {
              if (msg.startsWith('feat')) groups['Features'].push(msg);
              else if (msg.startsWith('fix')) groups['Bug Fixes'].push(msg);
              else if (msg.startsWith('refactor') || msg.startsWith('perf') || msg.startsWith('chore')) groups['Improvements'].push(msg);
              else if (msg.startsWith('ci') || msg.startsWith('build')) groups['CI / Build'].push(msg);
              else if (!msg.toLowerCase().startsWith('merge')) groups['Other'].push(msg);
            }
            let body = `## What's new in v${version}\n\n`;
            for (const [title, items] of Object.entries(groups)) {
              if (items.length === 0) continue;
              body += `### ${title}\n`;
              for (const item of items) {
                const clean = item.replace(/^(feat|fix|refactor|perf|chore|ci|build)(\(.*?\))?:\s*/, '');
                body += `- ${clean}\n`;
              }
              body += '\n';
            }
            if (prevTag) {
              body += `**Full Changelog**: https://github.com/${{ github.repository }}/compare/${prevTag}...v${version}\n`;
            }
            return body;

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_glob: "target/x86_64-unknown-linux-gnu/release/shiny_counter"
            asset_name: "ShinyCounter-${VERSION}-linux-x86_64.tar.gz"
            archive_kind: tar
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_glob: "target/aarch64-unknown-linux-gnu/release/shiny_counter"
            asset_name: "ShinyCounter-${VERSION}-linux-aarch64.tar.gz"
            archive_kind: tar
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_glob: "target/x86_64-pc-windows-msvc/release/shiny_counter.exe"
            asset_name: "ShinyCounter-${VERSION}-windows-x86_64.exe"
            archive_kind: exe
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            artifact_glob: "target/aarch64-apple-darwin/release/shiny_counter"
            asset_name: "ShinyCounter-${VERSION}-macos-aarch64.dmg"
            archive_kind: macapp
          # Intel macOS is cross-compiled from an Apple Silicon runner - the
          # dedicated `macos-13` (Intel) image is being phased out and its
          # queue can stall jobs for 10+ minutes. macOS ships a universal
          # toolchain so this Just Works.
          - name: macos-x86_64
            os: macos-14
            target: x86_64-apple-darwin
            artifact_glob: "target/x86_64-apple-darwin/release/shiny_counter"
            asset_name: "ShinyCounter-${VERSION}-macos-x86_64.dmg"
            archive_kind: macapp

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the exact commit the tag points to, not whatever happens to
          # be at HEAD when the matrix gets dispatched.
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libgtk-3-dev \
            libssl-dev \
            libudev-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libegl-dev \
            libgbm-dev \
            libdrm-dev \
            libxcb1-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libclang-dev \
            clang \
            pkg-config

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact (Unix tarball - binary only)
        if: matrix.archive_kind == 'tar'
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          SRC: ${{ matrix.artifact_glob }}
          OUT: ${{ matrix.asset_name }}
        run: |
          set -eux
          OUT_NAME=$(echo "$OUT" | sed "s/\${VERSION}/$VERSION/")
          # Bundle just the binary, nothing else - README / LICENSE live on
          # the GitHub repo page.
          STAGE_DIR=$(mktemp -d)
          cp "$SRC" "$STAGE_DIR/shiny_counter"
          chmod +x "$STAGE_DIR/shiny_counter"
          tar -C "$STAGE_DIR" -czf "$OUT_NAME" shiny_counter
          rm -rf "$STAGE_DIR"
          echo "ASSET_PATH=$OUT_NAME" >> "$GITHUB_ENV"
          echo "ASSET_NAME=$OUT_NAME" >> "$GITHUB_ENV"

      - name: Stage artifact (Windows bare .exe)
        if: matrix.archive_kind == 'exe'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          SRC: ${{ matrix.artifact_glob }}
          OUT: ${{ matrix.asset_name }}
        run: |
          $version = $env:VERSION
          $outName = $env:OUT.Replace('${VERSION}', $version)
          # Upload the .exe straight - no zip, no README, no LICENSE.
          Copy-Item $env:SRC -Destination $outName -Force
          "ASSET_PATH=$outName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ASSET_NAME=$outName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage artifact (macOS .app + .dmg)
        if: matrix.archive_kind == 'macapp'
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          SRC: ${{ matrix.artifact_glob }}
          OUT: ${{ matrix.asset_name }}
          TARGET: ${{ matrix.target }}
          # Optional: set these secrets in GitHub → Settings → Secrets to enable
          # full notarization. Without them, ad-hoc signing is used instead.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euxo pipefail
          OUT_NAME=$(echo "$OUT" | sed "s/\${VERSION}/$VERSION/")
          APP_DIR="ShinyCounter.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          cp "$SRC" "$APP_DIR/Contents/MacOS/shiny_counter"
          chmod +x "$APP_DIR/Contents/MacOS/shiny_counter"

          # ---- Pokéball iconset -> icon.icns -----------------------------------
          # The build script wrote a 1024x1024 PNG into OUT_DIR. The path is
          # target/<triple>/release/build/shiny_counter-<hash>/out/icon-1024.png
          ICON_SRC=$(find "target/$TARGET/release/build" -name 'icon-1024.png' | head -1)
          if [ -n "$ICON_SRC" ] && [ -f "$ICON_SRC" ]; then
            ICONSET="ShinyCounter.iconset"
            rm -rf "$ICONSET"
            mkdir "$ICONSET"
            sips -z 16   16   "$ICON_SRC" --out "$ICONSET/icon_16x16.png"
            sips -z 32   32   "$ICON_SRC" --out "$ICONSET/icon_16x16@2x.png"
            sips -z 32   32   "$ICON_SRC" --out "$ICONSET/icon_32x32.png"
            sips -z 64   64   "$ICON_SRC" --out "$ICONSET/icon_32x32@2x.png"
            sips -z 128  128  "$ICON_SRC" --out "$ICONSET/icon_128x128.png"
            sips -z 256  256  "$ICON_SRC" --out "$ICONSET/icon_128x128@2x.png"
            sips -z 256  256  "$ICON_SRC" --out "$ICONSET/icon_256x256.png"
            sips -z 512  512  "$ICON_SRC" --out "$ICONSET/icon_256x256@2x.png"
            sips -z 512  512  "$ICON_SRC" --out "$ICONSET/icon_512x512.png"
            cp "$ICON_SRC"                       "$ICONSET/icon_512x512@2x.png"
            iconutil -c icns "$ICONSET" -o "$APP_DIR/Contents/Resources/icon.icns"
            rm -rf "$ICONSET"
            ICON_PLIST="<key>CFBundleIconFile</key><string>icon</string>"
          else
            echo "No icon-1024.png found - bundle will use the system default."
            ICON_PLIST=""
          fi

          cat > "$APP_DIR/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Shiny Counter</string>
            <key>CFBundleDisplayName</key><string>Shiny Counter</string>
            <key>CFBundleIdentifier</key><string>app.shinycounter</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleExecutable</key><string>shiny_counter</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSAppleEventsUsageDescription</key><string>Required to capture pixels from other windows.</string>
            <key>NSScreenCaptureUsageDescription</key><string>Shiny Counter samples on-screen colours to detect Pokémon encounters.</string>
            $ICON_PLIST
          </dict>
          </plist>
          EOF

          # Keep the hardened runtime at its strict defaults. Screen Recording
          # consent is driven by NSScreenCaptureUsageDescription above and does
          # not require disabling library validation.
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '  <key>com.apple.security.cs.allow-jit</key><false/>' \
            '  <key>com.apple.security.cs.allow-unsigned-executable-memory</key><false/>' \
            '  <key>com.apple.security.cs.allow-dyld-environment-variables</key><false/>' \
            '</dict></plist>' \
            > entitlements.plist

          # ---- Code signing ---------------------------------------------------
          # If APPLE_SIGNING_IDENTITY secret is set, use the real Developer ID.
          # Otherwise fall back to ad-hoc signing (-) which still removes the
          # "damaged" quarantine block when users run: xattr -cr ShinyCounter.app
          SIGN_ID="${APPLE_SIGNING_IDENTITY:--}"
          codesign --deep --force --options runtime \
            --entitlements entitlements.plist \
            --sign "$SIGN_ID" \
            "$APP_DIR"
          codesign --verify --deep --strict "$APP_DIR"

          # ---- Notarization (only when Apple credentials are available) --------
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] && [ "$SIGN_ID" != "-" ]; then
            # Create a zip for submission (notarytool doesn't accept .app directly)
            ditto -c -k --keepParent "$APP_DIR" "${APP_DIR%.app}-notarize.zip"
            xcrun notarytool submit "${APP_DIR%.app}-notarize.zip" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            rm -f "${APP_DIR%.app}-notarize.zip"
          fi

          # Build a .dmg containing the .app
          DMG_STAGE="dmg-stage"
          rm -rf "$DMG_STAGE"
          mkdir -p "$DMG_STAGE"
          cp -R "$APP_DIR" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications" || true
          hdiutil create -volname "Shiny Counter" -srcfolder "$DMG_STAGE" \
            -ov -format UDZO "$OUT_NAME"

          # Sign the DMG itself so Gatekeeper accepts the outer container too.
          codesign --force --sign "$SIGN_ID" "$OUT_NAME"

          # Staple notarization ticket to DMG if notarization ran.
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] && [ "$SIGN_ID" != "-" ]; then
            xcrun stapler staple "$OUT_NAME" || true
          fi

          echo "ASSET_PATH=$OUT_NAME" >> "$GITHUB_ENV"
          echo "ASSET_NAME=$OUT_NAME" >> "$GITHUB_ENV"

      - name: Store release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.name }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ShinyCounter-* > SHA256SUMS

      - name: Attest release build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create and publish release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_BODY: ${{ needs.prepare-release.outputs.changelog }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const version = process.env.RELEASE_VERSION;
            const tag = process.env.RELEASE_TAG;
            let release;
            try {
              ({ data: release } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `Shiny Counter ${tag}`,
                body: process.env.RELEASE_BODY,
                draft: true,
                prerelease: false,
              }));

              const files = fs.readdirSync('dist').sort();
              if (files.length === 0) throw new Error('No release assets were downloaded');
              for (const name of files) {
                const assetPath = path.join('dist', name);
                if (!fs.statSync(assetPath).isFile()) continue;
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  name,
                  data: fs.readFileSync(assetPath),
                });
              }

              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                draft: false,
              });
              core.info(`Published Shiny Counter ${version} from ${context.sha}`);
            } catch (error) {
              if (release) {
                try {
                  await github.rest.repos.deleteRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: release.id,
                  });
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `tags/${tag}`,
                  });
                } catch (cleanupError) {
                  core.warning(`Release cleanup failed: ${cleanupError.message}`);
                }
              }
              throw error;
            }
